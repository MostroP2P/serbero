[package]
name = "serbero"
version = "0.1.0"
edition = "2024"
description = "Helps the parties of a Mostro dispute resolve it themselves, and escalates to a human solver when needed"
license = "MIT"
repository = "https://github.com/MostroP2P/serbero"
readme = "README.md"
keywords = ["mostro", "nostr", "bitcoin", "dispute", "p2p"]
categories = ["command-line-utilities"]
# What `cargo install serbero` needs to build, plus the files the README tells
# operators to copy. Tests, golden cases and specs stay in the repository.
include = [
    "/src/**/*",
    "/messages/*.toml",
    "/build.rs",
    "/config.sample.toml",
    "/deploy/*",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# Named so `cargo install serbero` does not put an `eval` command on PATH,
# where it would shadow the shell builtin in scripts that call it by path.
[[bin]]
name = "serbero-eval"
path = "src/bin/eval.rs"

[dependencies]
futures-util = "0.3.34"
mostro-core = "0.15.1"
nostr-sdk = "0.45.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
nostr-sdk = { version = "0.45.4", features = ["local-relay"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "test-util", "process"] }
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
