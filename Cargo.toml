[package]
name = "serbero"
version = "0.1.0"
edition = "2024"
description = "Helps the parties of a Mostro dispute resolve it themselves, and escalates to a human solver when needed"
license = "MIT"
repository = "https://github.com/MostroP2P/serbero"

[dependencies]
mostro-core = "0.15.1"
nostr-sdk = "0.45.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
nostr-sdk = { version = "0.45.4", features = ["local-relay"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
