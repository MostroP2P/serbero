# cargo-release configuration (README "Releasing"). `cargo release minor -x`
# on main bumps the version, dates the changelog, commits, tags and pushes.
# The tag makes the release workflow publish binaries, the container image
# and the notes, and then the crate to crates.io. A crates.io version can
# never be replaced, so it is published last, from CI, once everything else
# is out; never from a local checkout.

# Releases are cut from main only, since cargo-release pushes there directly.
allow-branch = ["main"]
publish = false

# cargo-release only warns when main is behind origin/main; this stops it.
pre-release-hook = ["scripts/release-check.sh"]

tag-name = "v{{version}}"
tag-message = "Serbero {{tag_name}}"
pre-release-commit-message = "chore(release): {{version}}"

# Dates the unreleased notes and opens a new empty section above them; the
# release workflow publishes the dated section as the release notes.
[[pre-release-replacements]]
file = "CHANGELOG.md"
search = "## \\[Unreleased\\]"
replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}"
exactly = 1
