name: Release

# A version tag (`v1.2.3`) builds the daemon for every supported platform and
# publishes a GitHub release with the binaries, their checksums, and the
# tag's section of CHANGELOG.md (plan T6.3).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: tag, changelog and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: CHANGELOG has a section for the tag
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    name: build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native builds only: SQLite is bundled and TLS uses ring, so each
          # target builds on its own runner without a cross toolchain.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --bin serbero --target ${{ matrix.target }}
      - name: Package
        run: |
          name="serbero-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/serbero" LICENSE README.md CHANGELOG.md config.sample.toml "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: serbero-${{ matrix.target }}
          path: serbero-*.tar.gz*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Serbero $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
