name: Release

# A version tag (`v1.2.3`) builds the daemon for every supported platform and
# publishes a GitHub release with the binaries, their checksums, and the
# tag's section of CHANGELOG.md (plan T6.3). It also publishes a multi-arch
# container image to GHCR, with build provenance (plan T6.8).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/mostrop2p/serbero

jobs:
  check:
    name: tag, changelog and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: CHANGELOG has a section for the tag
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    name: build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native builds only: SQLite is bundled and TLS uses ring, so each
          # target builds on its own runner without a cross toolchain.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --bin serbero --target ${{ matrix.target }}
      - name: Package
        run: |
          name="serbero-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name/deploy"
          cp "target/${{ matrix.target }}/release/serbero" LICENSE README.md CHANGELOG.md config.sample.toml "$name/"
          # The systemd unit and env template, so the README's systemd
          # instructions work from the archive alone.
          cp deploy/serbero.service deploy/serbero.env.sample "$name/deploy/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: serbero-${{ matrix.target }}
          path: serbero-*.tar.gz*
          if-no-files-found: error

  image:
    name: image ${{ matrix.platform }}
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native runners: compiling Rust under QEMU emulation takes an hour.
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pushed by digest only; the manifest job below tags the multi-arch
      # image once every platform is built.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.os }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  image-manifest:
    name: image manifest
    # Tags the image only after the GitHub release is published, so a tag
    # never publishes an image without its release. If this job fails, the
    # release exists and re-running the failed jobs finishes the image.
    needs: [image, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      # `X.Y.Z` always; `X.Y` and `latest` only while this is the newest
      # stable release of its line, or of all, so a slower run for an older
      # tag never moves them back (scripts/image-aliases.sh).
      - id: tags
        name: Choose the image tags
        run: |
          version=${GITHUB_REF_NAME#v}
          git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' \
            | scripts/image-aliases.sh "$version" > "$RUNNER_TEMP/aliases"
          cat "$RUNNER_TEMP/aliases"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while read -r alias; do tags+=(-t "$IMAGE:$alias"); done < "$RUNNER_TEMP/aliases"
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - id: digest
        name: Read the image digest
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Lets operators check where the image came from:
      # gh attestation verify oci://ghcr.io/mostrop2p/serbero:X.Y.Z -R MostroP2P/serbero
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Only the binary archives: the image jobs' digests and build records
      # are artifacts of the same run and must not become release assets.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: serbero-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Serbero $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
