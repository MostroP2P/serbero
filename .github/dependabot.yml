# Dependency update PRs (plan T6.6). AGENTS.md asks for the latest stable
# version of every crate, with each bump in its own PR.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Patch and minor releases of ordinary crates in one weekly PR.
      cargo-minor:
        update-types: [minor, patch]
        exclude-patterns:
          - nostr-sdk
          - mostro-core
    # nostr-sdk and mostro-core change the protocol surface; every bump gets
    # its own PR and is checked against the Mostro version Serbero targets.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
