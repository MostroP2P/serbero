# Runs Serbero with Docker Compose. From this directory:
#
#   cp ../config.sample.toml config.toml     # then edit it
#   chmod 644 config.toml                    # read by UID 10001; holds no secrets
#   cp serbero.env.sample serbero.env        # then fill it in
#   chmod 600 serbero.env
#   echo SERBERO_VERSION=X.Y.Z > .env        # a released version, without the v
#   docker compose up -d
#
# The version is required, never `latest`, so an update is a deliberate
# change: edit .env and run `docker compose up -d` again. To build from this
# checkout instead, add compose.build.yml (see that file).
services:
  serbero:
    image: ghcr.io/mostrop2p/serbero:${SERBERO_VERSION:?set SERBERO_VERSION in deploy/.env to a released version}
    restart: unless-stopped
    env_file: serbero.env
    volumes:
      - ./config.toml:/etc/serbero/config.toml:ro
      - serbero-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  serbero-data:
